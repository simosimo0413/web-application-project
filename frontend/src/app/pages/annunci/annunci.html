
<section class="pagina-annunci">

  <header class="intestazione">
    <h1>Esplora gli immobili</h1>
    <p>
      Scopri tutte le nostre proposte immobiliari
      in vendita e in affitto.
    </p>
  </header>

  <div class="contenitore">

    <form class="filtri" (ngSubmit)="caricaAnnunci()">

      <div class="campo">
        <label for="citta">Città</label>
        <input
          id="citta"
          name="citta"
          type="text"
          placeholder="Es. Cosenza"
          [(ngModel)]="filtri.citta"
        />
      </div>

      <div class="campo">
        <label for="prezzoMax">Prezzo massimo (€)</label>
        <input
          id="prezzoMax"
          name="prezzoMax"
          type="number"
          min="0"
          placeholder="Es. 200000"
          [(ngModel)]="filtri.prezzoMax"
        />
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <select
          id="categoria"
          name="categoria"
          [(ngModel)]="filtri.categoria"
        >
          <option value="">Tutte le categorie</option>
          <option value="Appartamento">Appartamento</option>
          <option value="Villa">Villa</option>
          <option value="Casa indipendente">Casa indipendente</option>
          <option value="Terreno">Terreno</option>
          <option value="Garage">Garage</option>
        </select>
      </div>

      <div class="campo">
        <label for="tipoContratto">Contratto</label>
        <select
          id="tipoContratto"
          name="tipoContratto"
          [(ngModel)]="filtri.tipoContratto"
        >
          <option value="">Vendita e affitto</option>
          <option value="VENDITA">Vendita</option>
          <option value="AFFITTO">Affitto</option>
        </select>
      </div>

      <div class="campo">
        <label for="ordinamento">Ordina per</label>
        <select
          id="ordinamento"
          name="ordinamento"
          [(ngModel)]="filtri.ordinamento"
        >
          <option value="RECENTI">Più recenti</option>
          <option value="PREZZO_ASC">Prezzo crescente</option>
          <option value="PREZZO_DESC">Prezzo decrescente</option>
          <option value="SUPERFICIE_ASC">Metri quadri crescenti</option>
          <option value="SUPERFICIE_DESC">Metri quadri decrescenti</option>
        </select>
      </div>

      <button type="submit" class="pulsante-cerca">
        Cerca immobili
      </button>

    </form>

    <p *ngIf="caricamento">
      Caricamento immobili in corso...
    </p>

    <div *ngIf="errore" class="messaggio">
      <p>Impossibile caricare gli immobili.</p>
      <button type="button" (click)="caricaAnnunci()">
        Riprova
      </button>
    </div>

    <p *ngIf="!caricamento && !errore && annunci.length === 0">
      Nessun immobile disponibile al momento.
    </p>

    <div
      class="griglia-annunci"
      *ngIf="!caricamento && !errore && annunci.length > 0">

      <app-immobile-card
        *ngFor="let annuncio of annunci"
        [annuncio]="annuncio">
      </app-immobile-card>

    </div>

  </div>

</section>
