
<header class="navbar">
  <h2>Immobiliare</h2>

  <nav>
    <a routerLink="/">Home</a>
    <a href="/#annunci">Annunci</a>

    @if (authService.utenteCorrente(); as utente) {
      <span class="nav-placeholder">
        Ciao, {{ utente.nome || utente.email }}
      </span>

      <button
        type="button"
        class="pulsante-logout"
        (click)="esci()"
        [disabled]="uscitaInCorso()">
        {{ uscitaInCorso() ? 'Uscita...' : 'Esci' }}
      </button>
    } @else {
      <a routerLink="/login">Accedi</a>
    }

    @if (erroreLogout()) {
      <span class="errore-logout" role="alert">
        {{ erroreLogout() }}
      </span>
    }

  </nav>
</header>
